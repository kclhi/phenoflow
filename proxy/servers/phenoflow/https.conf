server {

  listen 443      ssl http2;
  listen [::]:443 ssl http2;
  server_name     localhost;
  ssl_certificate           /etc/nginx/ssl/phenoflow-proxy-1.crt;
  ssl_certificate_key       /etc/nginx/ssl/phenoflow-proxy-1.key;
  access_log                /var/log/nginx/access.log;

  include /etc/nginx/servers/phenoflow/locations.conf;

}
