# Phenoflow

# cwlviewer

location /phenoflow {
  proxy_set_header Host $http_host;
  proxy_set_header X-Real-IP  $remote_addr;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_pass http://cwlviewer-spring-1:8080;
}

# importer

location ~ ^/phenoflow/(docs|importer|login) {
  proxy_set_header Host $http_host;
  proxy_set_header X-Real-IP  $remote_addr;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_pass https://importer-webapp-1:3003;
}